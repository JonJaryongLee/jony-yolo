<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 이미지 분석 대시보드</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Image Analysis Dashboard</h1>
      </header>

      <div class="image-comparison-container">
        <div class="image-card">
          <div class="card-header">원본 이미지 (Preview)</div>
          <div class="img-box">
            <img class="preview-img" src="" alt="파일을 선택하세요" />
          </div>
        </div>
        <div class="image-card">
          <div class="card-header">분석 결과 (Result)</div>
          <div class="img-box result-placeholder">
            <img class="result-img" src="" alt="" />
          </div>
        </div>
      </div>

      <div class="controls">
        <input
          type="file"
          id="fileInput"
          class="file-input"
          accept="image/jpeg, image/png"
          style="display: none"
        />
        <button
          class="select-btn"
          onclick="document.getElementById('fileInput').click()"
        >
          이미지 선택
        </button>
        <button class="send-btn">분석 시작</button>
      </div>

      <div class="chart-container">
        <div class="chart-wrapper">
          <div class="chart-title">객체별 수량</div>
          <canvas id="chart1"></canvas>
        </div>
        <div class="chart-wrapper">
          <div class="chart-title">평균 신뢰도 (%)</div>
          <canvas id="chart2"></canvas>
        </div>
        <div class="chart-wrapper">
          <div class="chart-title">객체 분포 비율</div>
          <canvas id="chart3"></canvas>
        </div>
        <div class="chart-wrapper">
          <div class="chart-title">종합 분석 지표</div>
          <canvas id="chart4"></canvas>
        </div>
      </div>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
